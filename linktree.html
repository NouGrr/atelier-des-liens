<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Les liens de L'Atelier des Liens : site officiel et Facebook.">
    <meta name="theme-color" content="#fffaf1">
    <title>L'Atelier des Liens | Tous nos liens</title>
    <meta property="og:title" content="L'Atelier des Liens | Tous nos liens">
    <meta property="og:description" content="Les liens de L'Atelier des Liens : site officiel et Facebook.">
    <meta property="og:image" content="https://atelierdesliens-bening.fr/assets/logo-atelier-des-liens.png">
    <meta property="og:url" content="https://atelierdesliens-bening.fr/linktree.html">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:type" content="website">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png">
    <style>
      :root { --ink: #17263d; --cream: #fffaf1; --peach: #fff0dc; --pink: #d81b60; --orange: #e65100; --line: #eadfd1; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 10% 0%, #ffe5ee 0 18%, transparent 42%), radial-gradient(circle at 100% 100%, #ffe2ba 0 12%, transparent 38%), var(--cream); font-family: Arial, Helvetica, sans-serif; }
      main { width: min(100% - 32px, 520px); margin: 0 auto; padding: 44px 0 32px; text-align: center; }
      .brand { width: 108px; height: 108px; margin: 0 auto 20px; border: 8px solid #fff; border-radius: 50%; box-shadow: 0 12px 30px rgba(23, 38, 61, .12); }
      h1 { margin: 0; font-size: clamp(1.8rem, 7vw, 2.5rem); line-height: 1.05; }
      h1 em { color: var(--pink); font-family: Georgia, serif; font-weight: 400; }
      .intro { max-width: 390px; margin: 16px auto 28px; color: #525e75; line-height: 1.55; }
      .links { display: grid; gap: 14px; }
      .link { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 20px 12px 14px; color: var(--ink); background: rgba(255, 255, 255, .88); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 8px 20px rgba(23, 38, 61, .07); font-size: 1rem; font-weight: 700; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
      .link:hover, .link:focus-visible { border-color: var(--pink); box-shadow: 0 12px 26px rgba(216, 27, 96, .14); transform: translateY(-2px); outline: none; }
      .icon { display: grid; flex: 0 0 42px; place-items: center; width: 42px; height: 42px; border-radius: 14px; color: #fff; background: var(--pink); font-size: 1.35rem; }
      .link:nth-child(2) .icon { background: #1877f2; font-family: Georgia, serif; font-weight: 700; }
      .link span:last-child { flex: 1; text-align: left; }
      .arrow { flex: 0 0 auto; color: var(--pink); font-size: 1.4rem; }
      footer { margin-top: 34px; color: #7b8492; font-size: .82rem; }
      footer a { color: var(--pink); font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img class="brand" src="assets/logo-atelier-des-liens.png" alt="Logo de L'Atelier des Liens">
      <h1>L'Atelier <em>des Liens</em></h1>
      <p class="intro">Une association intergénérationnelle à Béning-lès-Saint-Avold. Retrouvez-nous en ligne.</p>
      <nav class="links" aria-label="Nos liens">
        <a class="link" href="https://atelierdesliens-bening.fr" aria-label="Visiter le site officiel">
          <span class="icon" aria-hidden="true">⌂</span><span>Visiter notre site</span>
        </a>
        <a class="link" href="https://www.facebook.com/profile.php?id=61596247804913&amp;locale=fr_FR" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir notre page Facebook">
          <span class="icon" aria-hidden="true">f</span><span>Nous suivre sur Facebook</span>
        </a>
      </nav>
      <footer><a href="https://atelierdesliens-bening.fr">L'Atelier des Liens</a> · Partager, échanger, grandir ensemble</footer>
    </main>
  </body>
</html>
