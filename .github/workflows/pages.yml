name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html linktree.html confidentialite.html 404.html styles.css script.js robots.txt sitemap.xml _site/
          mkdir _site/assets
          cp assets/logo-atelier-des-liens.png assets/logo-icon.png assets/formulaire-adhesion-avec-liens.pdf assets/formulaire-adhesion-avec-liens.png _site/assets/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
